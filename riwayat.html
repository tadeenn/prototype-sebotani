<!-- SCRIPT INTEGRASI WEBSOCKET & PEMBERSIHAN RIWAYAT -->
<script>
    // 1. Set Tanggal Hari Ini pada Header Timeline
    const sekarang = new Date();
    const opsiTgl = { day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('current-date-label').innerText = sekarang.toLocaleDateString('id-ID', opsiTgl);

    // 2. Kosongkan riwayat awal (Dikosongkan sesuai permintaan agar bersih dari uji coba)
    let riwayatAktivitas = JSON.parse(localStorage.getItem('sebotani_riwayat_aktivitas')) || [];

    function renderRiwayat() {
        const container = document.getElementById('dynamic-history-container');
        container.innerHTML = "";

        if (riwayatAktivitas.length === 0) {
            container.innerHTML = `
                <div class="bg-surface-container-lowest p-lg rounded-2xl border border-outline-variant/20 text-center space-y-2 shadow-sm">
                    <span class="material-symbols-outlined text-outline text-4xl">history_toggle_off</span>
                    <p class="font-title-sm text-on-surface text-sm">Belum ada riwayat aktivitas</p>
                    <p class="text-xs text-on-surface-variant">Aktivitas penyemprotan air, pupuk, atau sinkronisasi sensor akan muncul di sini secara otomatis.</p>
                </div>
            `;
            return;
        }

        riwayatAktivitas.forEach(item => {
            const card = document.createElement('div');
            
            if (item.tipe === 'secondary') {
                card.className = "bg-surface-container-lowest p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-primary/10 hover:shadow-lg transition-all duration-300 rounded-2xl";
                card.innerHTML = `
                    <div class="flex gap-md">
                        <div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-secondary">${item.ikon}</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="font-title-sm text-title-sm text-on-surface">${item.judul}</h3>
                                <span class="text-xs text-on-surface-variant font-medium">Sinkronisasi Berhasil</span>
                            </div>
                            <div class="grid grid-cols-2 gap-sm mt-md">
                                <div class="bg-surface-container-low rounded-lg p-sm flex flex-col items-center justify-center border border-outline-variant/30">
                                    <span class="font-label-caps text-label-caps text-on-surface-variant mb-1">pH Tanah</span>
                                    <span class="font-data-mono text-data-mono text-primary">${item.ph}</span>
                                </div>
                                <div class="bg-surface-container-low rounded-lg p-sm flex flex-col items-center justify-center border border-outline-variant/30">
                                    <span class="font-label-caps text-label-caps text-on-surface-variant mb-1">Kelembapan</span>
                                    <span class="font-data-mono text-data-mono text-primary">${item.moist}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-xs mt-sm text-on-surface-variant/70 text-xs">
                                <span class="material-symbols-outlined text-[16px]">schedule</span>
                                <span>${item.waktu}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                card.className = "bg-surface-container-lowest p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant/20 hover:shadow-lg transition-all duration-300 group rounded-2xl";
                card.innerHTML = `
                    <div class="flex gap-md">
                        <div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-primary">${item.ikon}</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="font-title-sm text-title-sm text-on-surface">${item.judul}</h3>
                                <span class="inline-flex items-center px-xs py-0.5 rounded-full bg-primary-container text-on-primary-container text-[11px] font-bold uppercase">Selesai</span>
                            </div>
                            <p class="text-on-surface-variant mt-1">${item.desc}</p>
                            <div class="flex items-center gap-xs mt-sm text-on-surface-variant/70 text-xs">
                                <span class="material-symbols-outlined text-[16px]">schedule</span>
                                <span>${item.waktu}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            container.appendChild(card);
        });
    }

    function tambahRiwayatBaru(judul, desc, ikon, tipe = 'primary', ph = null, moist = null) {
        const waktuStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        const itemBaru = {
            id: Date.now(),
            judul: judul,
            desc: desc,
            ikon: ikon,
            waktu: waktuStr,
            tipe: tipe,
            ph: ph,
            moist: moist
        };

        riwayatAktivitas.unshift(itemBaru);
        if (riwayatAktivitas.length > 20) riwayatAktivitas.pop();
        localStorage.setItem('sebotani_riwayat_aktivitas', JSON.stringify(riwayatAktivitas));
        renderRiwayat();
    }

    // 3. KONEKSI WEBSOCKET UNTUK MEREKAM AKTIVITAS RELAY SECARA REAL-TIME
    const wsUrl = 'wss://console.flux.id/ws/public/nodes/c3d4e33c-b9df-45e4-af6d-71a4a183541f';
    let socket;

    function hubungkanWebSocketRiwayat() {
        socket = new WebSocket(wsUrl);

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                // Merekam perintah eksekusi relay dari mesin
                if (data.type === 'command_ack' || (data.payload && data.payload.relay)) {
                    const relayNum = data.payload.relay;
                    const durasi = data.payload.duration || 10;
                    const namaOutput = relayNum === 1 ? "Penyiraman Air (Output 1)" : "Penyemprotan Pupuk (Output 2)";
                    const ikonRelay = relayNum === 1 ? "water_drop" : "compost";
                    
                    tambahRiwayatBaru(
                        `Aktivasi Relay Mesin`, 
                        `Mesin mengeksekusi ${namaOutput} selama ${durasi} detik.`, 
                        ikonRelay, 
                        'primary'
                    );
                }
            } catch(e) {}
        };

        socket.onclose = () => {
            setTimeout(hubungkanWebSocketRiwayat, 5000);
        };
    }

    // Mendengarkan event dari halaman penjadwalan
    window.addEventListener('storage', (e) => {
        if (e.key === 'sebotani_riwayat_aktivitas') {
            riwayatAktivitas = JSON.parse(e.newValue) || [];
            renderRiwayat();
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        renderRiwayat();
        hubungkanWebSocketRiwayat();
    });

    document.querySelectorAll('button, a').forEach(el => {
        el.addEventListener('touchstart', () => {}, {passive: true});
    });

    let lastScrollTop = 0;
    const nav = document.querySelector('nav');
    window.addEventListener('scroll', function() {
        let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop && scrollTop > 100) {
            nav.style.transform = 'translateY(100%)';
            nav.style.transition = 'transform 0.3s ease-in-out';
        } else {
            nav.style.transform = 'translateY(0)';
        }
        lastScrollTop = scrollTop;
    });
</script>
