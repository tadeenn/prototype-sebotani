<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDoc, setDoc, doc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDTSexC_iufQJtZEwBhP4vF3pa1VdgvZM",
        authDomain: "sebotani-database.firebaseapp.com",
        projectId: "sebotani-database",
        storageBucket: "sebotani-database.firebasestorage.app",
        messagingSenderId: "100314098060",
        appId: "1:100314098060:web:29a6b3a8357f9a7e948ea9"
    };

    try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.dbTools = { collection, addDoc, getDoc, setDoc, doc, query, orderBy, limit, onSnapshot };
        window.firebaseReady = true;
    } catch(e) {
        console.warn("Gagal inisialisasi Firebase:", e);
    }
</script>

<script>
    const sekarang = new Date();
    const opsiTgl = { day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('current-date-label').innerText = sekarang.toLocaleDateString('id-ID', opsiTgl);

    let riwayatAktivitas = JSON.parse(localStorage.getItem('sebotani_riwayat_aktivitas')) || [];

    function renderRiwayat(dataArray) {
        const container = document.getElementById('dynamic-history-container');
        container.innerHTML = "";

        if (!dataArray || dataArray.length === 0) {
            container.innerHTML = `
                <div class="bg-surface-container-lowest p-6 rounded-2xl border border-outline-variant/20 text-center space-y-2 shadow-sm">
                    <span class="material-symbols-outlined text-outline text-4xl">history_toggle_off</span>
                    <p class="font-bold text-on-surface text-sm">Belum ada riwayat aktivitas</p>
                    <p class="text-xs text-on-surface-variant">Aktivitas penyemprotan air, pupuk, atau sinkronisasi sensor akan muncul di sini secara otomatis.</p>
                </div>
            `;
            return;
        }

        dataArray.forEach(item => {
            const card = document.createElement('div');
            
            // Konfigurasi Status (Berhasil/Gagal)
            const isGagal = item.status === 'gagal';
            const badgeClass = isGagal ? "bg-error-container text-on-error-container" : "bg-primary-container text-on-primary-container";
            const badgeText = isGagal ? "GAGAL" : "SELESAI";
            const iconBg = isGagal ? "bg-error/10" : "bg-primary-container/20";
            const iconColor = isGagal ? "text-error" : "text-primary";
            const alasanHtml = isGagal && item.alasan ? `<p class="text-[11px] text-error font-semibold mt-1">Catatan: ${item.alasan}</p>` : "";

            if (item.tipe === 'secondary') {
                card.className = "bg-surface-container-lowest p-4 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-primary/10 hover:shadow-lg transition-all duration-300 rounded-2xl";
                card.innerHTML = `
                    <div class="flex gap-4">
                        <div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-secondary">${item.ikon}</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="text-[16px] font-bold text-on-surface">${item.judul}</h3>
                                <span class="text-xs text-on-surface-variant font-medium">Sinkronisasi</span>
                            </div>
                            <div class="grid grid-cols-2 gap-3 mt-3">
                                <div class="bg-surface-container-low rounded-lg p-2 flex flex-col items-center justify-center border border-outline-variant/30">
                                    <span class="text-[10px] font-bold tracking-wider text-on-surface-variant mb-1">pH Tanah</span>
                                    <span class="text-lg font-bold text-primary">${item.ph}</span>
                                </div>
                                <div class="bg-surface-container-low rounded-lg p-2 flex flex-col items-center justify-center border border-outline-variant/30">
                                    <span class="text-[10px] font-bold tracking-wider text-on-surface-variant mb-1">Kelembapan</span>
                                    <span class="text-lg font-bold text-primary">${item.moist}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-1 mt-3 text-on-surface-variant/70 text-xs">
                                <span class="material-symbols-outlined text-[16px]">schedule</span>
                                <span>${item.waktu}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                card.className = "bg-surface-container-lowest p-4 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant/20 hover:shadow-lg transition-all duration-300 group rounded-2xl";
                card.innerHTML = `
                    <div class="flex gap-4">
                        <div class="w-12 h-12 rounded-full ${iconBg} flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined ${iconColor}">${item.ikon}</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="text-[15px] font-bold text-on-surface">${item.judul}</h3>
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full ${badgeClass} text-[10px] font-bold tracking-wider uppercase">${badgeText}</span>
                            </div>
                            <p class="text-[13px] text-on-surface-variant mt-1 leading-relaxed">${item.desc}</p>
                            ${alasanHtml}
                            <div class="flex items-center gap-1 mt-3 text-on-surface-variant/70 text-xs">
                                <span class="material-symbols-outlined text-[16px]">schedule</span>
                                <span>${item.waktu}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            container.appendChild(card);
        });
    }

    function mulaiMendengarkanFirestore() {
        if (!window.firebaseReady || !window.db) return;
        try {
            const collRef = window.dbTools.collection(window.db, "sebotani_riwayat");
            const q = window.dbTools.query(collRef, window.dbTools.orderBy("id", "desc"), window.dbTools.limit(25));
            
            window.dbTools.onSnapshot(q, (snapshot) => {
                const riwayatCloud = [];
                snapshot.forEach((doc) => { riwayatCloud.push(doc.data()); });
                if (riwayatCloud.length > 0) {
                    riwayatAktivitas = riwayatCloud;
                    localStorage.setItem('sebotani_riwayat_aktivitas', JSON.stringify(riwayatAktivitas));
                    renderRiwayat(riwayatAktivitas);
                }
            });
        } catch(e) {}
    }

    const wsUrl = 'wss://console.flux.id/ws/public/nodes/c3d4e33c-b9df-45e4-af6d-71a4a183541f';
    let socket;

    // Untuk memastikan riwayat tidak tertumpuk/ganda jika tab riwayat sedang dibuka
    function hubungkanWebSocketRiwayat() {
        socket = new WebSocket(wsUrl);
        socket.onmessage = (event) => {}; // Hanya Listen Firestore agar tidak duplikat
        socket.onclose = () => { setTimeout(hubungkanWebSocketRiwayat, 5000); };
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderRiwayat(riwayatAktivitas);
        hubungkanWebSocketRiwayat();
        setTimeout(() => {
            if (window.firebaseReady) mulaiMendengarkanFirestore();
        }, 1500);
    });

    document.querySelectorAll('button, a').forEach(el => { el.addEventListener('touchstart', () => {}, {passive: true}); });

</script>
