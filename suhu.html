    <!-- FAB Interaction Script -->

        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('click', (e) => {

                ripple.className = 'absolute bg-white/20 rounded-full scale-0 animate-ping pointer-events-none';
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                el.classList.add('relative', 'overflow-hidden');
                el.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>

    <!-- INTEGRASI REAL-TIME WEBSOCKET & POPUP LOGIC UNTUK SUHU -->
    <script>
        // 1. Logika untuk menampilkan dan menyembunyikan Popup
        function tampilkanPopup() {
            const popup = document.getElementById('connection-popup');
            const popupContent = document.getElementById('popup-content');
            
            popup.classList.remove('hidden');
            void popup.offsetWidth; 
            
            popup.classList.remove('opacity-0');
            popupContent.classList.remove('scale-95');
        }

        function tutupPopup() {
            const popup = document.getElementById('connection-popup');
            const popupContent = document.getElementById('popup-content');
            
            popup.classList.add('opacity-0');
            popupContent.classList.add('scale-95');
            
            setTimeout(() => {
                popup.classList.add('hidden');
            }, 300);
            
            aturUlangWaktuTunggu();
        }

        window.addEventListener('offline', tampilkanPopup);

        // 2. Variabel Timer untuk mendeteksi mesin mati
        let mesinTimeout;
        const BATAS_WAKTU_TUNGGU = 15000; // 15 detik

        function resetKeNol() {
            document.getElementById('temp-value').innerText = '0°C';
            document.getElementById('temp-bar').style.height = '0%';
            document.getElementById('temp-status').innerText = 'Tidak Terhubung';
            
            // Ubah warna bar dan bulb ke warna netral/abu-abu saat terputus
            document.getElementById('temp-bar').style.backgroundColor = '#9ca3af'; 
            document.getElementById('temp-bulb').style.backgroundColor = '#9ca3af'; 
            document.getElementById('temp-status').style.color = '#9ca3af'; 
        }

        function aturUlangWaktuTunggu() {
            clearTimeout(mesinTimeout); 
            
            mesinTimeout = setTimeout(() => {
                console.warn("Mesin tidak merespons selama 15 detik.");
                resetKeNol();
                tampilkanPopup();
            }, BATAS_WAKTU_TUNGGU);
        }

        // 3. Konfigurasi WebSocket
        const wsUrl = 'wss://console.flux.id/ws/public/nodes/c3d4e33c-b9df-45e4-af6d-71a4a183541f';
        const socket = new WebSocket(wsUrl);

        aturUlangWaktuTunggu(); 

        socket.onclose = () => {
            console.warn("Koneksi API terputus.");
            clearTimeout(mesinTimeout); 
            resetKeNol();
            tampilkanPopup();
        };

        socket.onerror = (error) => {
            console.error("Kesalahan jaringan API:", error);
            clearTimeout(mesinTimeout);
            resetKeNol();
            tampilkanPopup();
        };

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === 'telemetry' && data.payload && data.payload.payload) {
                    
                    // Mengambil nilai suhu (perhatikan ejaan 'temprature' sesuai output mesin)
                    const nilaiSuhu = data.payload.payload.soil_temprature; 

                    if (nilaiSuhu !== undefined && nilaiSuhu !== null && nilaiSuhu !== "") {
                        aturUlangWaktuTunggu(); 

                        const currentTemp = parseFloat(nilaiSuhu);
                        
                        if(isNaN(currentTemp)) return; 

                        // Update Angka
                        document.getElementById('temp-value').innerText = currentTemp.toFixed(1) + '°C';
                        
                        // Update Bar (Asumsi tinggi maksimal bar mewakili 40°C)
                        // Kalkulasi persentase tinggi: (Suhu saat ini / 40) * 100
                        let percent = (currentTemp / 40) * 100;
                        percent = Math.max(0, Math.min(100, percent)); 
                        document.getElementById('temp-bar').style.height = `${percent}%`;

                        // Update Status dan Warna
                        const statusText = document.getElementById('temp-status');
                        const tempBar = document.getElementById('temp-bar');
                        const tempBulb = document.getElementById('temp-bulb');
                        
                        // Logika perubahan warna berdasarkan suhu (opsional tapi bagus untuk visual)
                        let colorHex = '#006c49'; // Warna default (primary/sejuk)
                        
                        if (currentTemp < 20) {
                            statusText.innerText = 'Dingin';
                            colorHex = '#2563eb'; // Biru
                        } else if (currentTemp > 35) {
                            statusText.innerText = 'Sangat Panas';
                            colorHex = '#dc2626'; // Merah
                        } else if (currentTemp > 30) {
                            statusText.innerText = 'Hangat';
                            colorHex = '#ea580c'; // Oranye
                        } else {
                            statusText.innerText = 'Sejuk / Optimal';
                            colorHex = '#006c49'; // Hijau (Primary)
                        }

                        // Terapkan warna ke elemen
                        statusText.style.color = colorHex;
                        tempBar.style.backgroundColor = colorHex;
                        tempBulb.style.backgroundColor = colorHex;
                    }
                }
            } catch (err) {
                console.log("Mengabaikan pesan non-JSON dari server.");
            }
        };
    </script>
