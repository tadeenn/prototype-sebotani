<!DOCTYPE html>
<html class="light" lang="id">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>SEBOTANI - Analisis & Rekomendasi</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Pustaka Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#006c49",
                        "on-primary": "#ffffff",
                        "primary-container": "#10b981",
                        "on-primary-container": "#00422b",
                        "error": "#ba1a1a",
                        "surface": "#f8f9fa",
                        "on-surface": "#191c1d",
                        "surface-variant": "#e1e3e4",
                        "on-surface-variant": "#3c4a42",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#bbcabf",
                        "secondary": "#855300",
                        // Warna khusus grafik
                        "chart-ph": "#eab308",
                        "chart-moist": "#3b82f6",
                        "chart-temp": "#ef4444"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "margin-desktop": "40px"
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { background-color: #f8f9fa; color: #191c1d; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* Menyembunyikan scrollbar pada deretan tombol waktu */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">
    
    <!-- POPUP KONEKSI TERPUTUS -->
    <div id="connection-popup" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm">
        <div id="popup-content" class="bg-surface rounded-2xl shadow-xl p-6 max-w-sm w-[90%] flex flex-col items-center text-center transform scale-95 transition-transform duration-300 border border-outline-variant/30">
            <span class="material-symbols-outlined text-error text-[56px] mb-4">wifi_off</span>
            <h3 class="text-[18px] font-bold text-on-surface mb-2">Koneksi Terputus</h3>
            <p class="text-[14px] text-on-surface-variant mb-6 leading-relaxed">
                Coba cek koneksi internet Anda atau cek mesin SEBOTANI.
            </p>
            <button onclick="tutupPopup()" class="bg-primary text-on-primary font-semibold py-3 px-6 rounded-xl shadow-sm active:scale-95 transition-transform duration-150 w-full">
                Mengerti
            </button>
        </div>
    </div>

    <!-- TopAppBar -->
    <header class="fixed top-0 w-full z-50 bg-primary shadow-sm flex justify-between items-center px-margin-mobile h-14">
        <div class="flex items-center w-full justify-between">
            <a href="dashboard_petani.html" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 transition-colors active:scale-95 duration-150">
                <span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
            </a>
            <div class="flex flex-col items-center">
                <span class="text-[20px] font-semibold text-white">Analisis & Rekomendasi</span>
            </div>
            <div class="flex items-center justify-center w-10 h-10">
                <img alt="SEBOTANI Logo" src="https://prototype-sebotani.vercel.app/sebotani-logo.png">
            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow pt-20 pb-24 px-margin-mobile md:px-margin-desktop max-w-4xl mx-auto w-full">
        
        <!-- Live Data Overview -->
        <div class="grid grid-cols-3 gap-3 mb-4">
            <div class="bg-surface-container-lowest rounded-xl p-3 border border-outline-variant/30 text-center shadow-sm">
                <p class="text-[12px] text-on-surface-variant font-semibold mb-1">pH Tanah</p>
                <p id="live-ph" class="text-2xl font-bold text-chart-ph">0.0</p>
            </div>
            <div class="bg-surface-container-lowest rounded-xl p-3 border border-outline-variant/30 text-center shadow-sm">
                <p class="text-[12px] text-on-surface-variant font-semibold mb-1">Kelembapan</p>
                <p id="live-moist" class="text-2xl font-bold text-chart-moist">0%</p>
            </div>
            <div class="bg-surface-container-lowest rounded-xl p-3 border border-outline-variant/30 text-center shadow-sm">
                <p class="text-[12px] text-on-surface-variant font-semibold mb-1">Suhu Udara</p>
                <p id="live-temp" class="text-2xl font-bold text-chart-temp">0°C</p>
            </div>
        </div>

        <!-- Chart Card -->
        <div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-4 flex flex-col mb-4 border border-outline-variant/30">
            <div class="flex items-center gap-2 mb-4">
                <span class="material-symbols-outlined text-primary">monitoring</span>
                <h2 class="text-[16px] font-bold text-on-surface">Grafik Historis</h2>
            </div>
            
            <!-- Filter Waktu -->
            <div class="flex overflow-x-auto hide-scrollbar gap-2 mb-4 pb-1">
                <button onclick="ubahWaktu('1j')" class="waktu-btn bg-primary text-white text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">1 Jam</button>
                <button onclick="ubahWaktu('6j')" class="waktu-btn bg-surface-variant text-on-surface-variant text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">6 Jam</button>
                <button onclick="ubahWaktu('12j')" class="waktu-btn bg-surface-variant text-on-surface-variant text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">12 Jam</button>
                <button onclick="ubahWaktu('1h')" class="waktu-btn bg-surface-variant text-on-surface-variant text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">1 Hari</button>
                <button onclick="ubahWaktu('3h')" class="waktu-btn bg-surface-variant text-on-surface-variant text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">3 Hari</button>
                <button onclick="ubahWaktu('1m')" class="waktu-btn bg-surface-variant text-on-surface-variant text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">1 Minggu</button>
                <button onclick="ubahWaktu('1bln')" class="waktu-btn bg-surface-variant text-on-surface-variant text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">1 Bulan</button>
                <button onclick="ubahWaktu('3bln')" class="waktu-btn bg-surface-variant text-on-surface-variant text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">3 Bulan</button>
                <button onclick="ubahWaktu('6bln')" class="waktu-btn bg-surface-variant text-on-surface-variant text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">6 Bulan</button>
                <button onclick="ubahWaktu('1t')" class="waktu-btn bg-surface-variant text-on-surface-variant text-xs font-semibold py-1.5 px-3 rounded-full shrink-0">1 Tahun</button>
            </div>

            <!-- Area Grafik -->
            <div class="w-full h-[250px] relative">
                <canvas id="sebotaniChart"></canvas>
            </div>
        </div>

        <!-- AI Recommendation Card -->
        <div class="bg-[#eef2ff] rounded-xl p-5 flex flex-col border border-indigo-200 shadow-sm relative overflow-hidden">
            <span class="material-symbols-outlined absolute -right-4 -bottom-4 text-[120px] text-indigo-500/10" style="font-variation-settings: 'FILL' 1;">psychology</span>
            
            <div class="flex items-center gap-3 mb-3 relative z-10">
                <div class="bg-indigo-500 p-2 rounded-lg flex items-center justify-center shadow-md">
                    <span class="material-symbols-outlined text-white text-[20px]">smart_toy</span>
                </div>
                <h3 class="text-[18px] font-bold text-indigo-900">Saran AI Sebotani</h3>
                <span class="relative flex h-3 w-3 ml-auto">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                </span>
            </div>
            <div class="relative z-10 bg-white/60 backdrop-blur-sm p-4 rounded-xl border border-white/50">
                <p id="ai-text" class="text-[14px] text-indigo-950 leading-relaxed font-medium">
                    Menunggu aliran data untuk melakukan analisis...
                </p>
            </div>
        </div>
    </main>

    <!-- UI Interactions Script -->
    <script>
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.className = 'absolute bg-black/10 rounded-full scale-0 animate-ping pointer-events-none';
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                el.classList.add('relative', 'overflow-hidden');
                el.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        function tampilkanPopup() {
            const popup = document.getElementById('connection-popup');
            const popupContent = document.getElementById('popup-content');
            popup.classList.remove('hidden');
            void popup.offsetWidth; 
            popup.classList.remove('opacity-0');
            popupContent.classList.remove('scale-95');
        }

        function tutupPopup() {
            const popup = document.getElementById('connection-popup');
            const popupContent = document.getElementById('popup-content');
            popup.classList.add('opacity-0');
            popupContent.classList.add('scale-95');
            setTimeout(() => { popup.classList.add('hidden'); }, 300);
            aturUlangWaktuTunggu();
        }
        window.addEventListener('offline', tampilkanPopup);
    </script>

    <!-- CHART.JS LOGIC & GENERATOR WAKTU -->
    <script>
        const ctx = document.getElementById('sebotaniChart').getContext('2d');
        let sebotaniChart;

        const config = {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    { label: 'pH Tanah', borderColor: '#eab308', backgroundColor: '#eab308', data: [], yAxisID: 'y' },
                    { label: 'Kelembapan (%)', borderColor: '#3b82f6', backgroundColor: '#3b82f6', data: [], yAxisID: 'y1' },
                    { label: 'Suhu (°C)', borderColor: '#ef4444', backgroundColor: '#ef4444', data: [], yAxisID: 'y1' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
                },
                scales: {
                    x: { ticks: { maxTicksLimit: 6, font: { size: 10 } } },
                    y: { type: 'linear', display: true, position: 'left', min: 0, max: 14, title: { display: true, text: 'pH' } },
                    y1: { type: 'linear', display: true, position: 'right', min: 0, max: 100, grid: { drawOnChartArea: false }, title: { display: true, text: '% / °C' } }
                }
            }
        };

        sebotaniChart = new Chart(ctx, config);

        // ==========================================
        // PERBAIKAN: FORMAT WAKTU DI SUMBU X GRAFIK
        // ==========================================
        function ubahWaktu(rentang) {
            document.querySelectorAll('.waktu-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white');
                btn.classList.add('bg-surface-variant', 'text-on-surface-variant');
            });
            event.target.classList.remove('bg-surface-variant', 'text-on-surface-variant');
            event.target.classList.add('bg-primary', 'text-white');

            let points = 20;
            let labels = [];
            let dataPh = [], dataMoist = [], dataTemp = [];
            
            let now = new Date();
            let currentPh = 6.5; 
            let currentMoist = 70; 
            let currentTemp = 26; 

            for(let i = points; i >= 0; i--) {
                let timePoint = new Date(now.getTime());
                
                // Kurangi waktu mundur sesuai rentang yang dipilih
                if(rentang === '1j') timePoint.setMinutes(now.getMinutes() - (i * 3));
                else if(rentang === '6j') timePoint.setMinutes(now.getMinutes() - (i * 18));
                else if(rentang === '12j') timePoint.setMinutes(now.getMinutes() - (i * 36));
                else if(rentang === '1h') timePoint.setHours(now.getHours() - Math.floor(i * 1.2));
                else if(rentang === '3h') timePoint.setHours(now.getHours() - (i * 3.6));
                else if(rentang === '1m') timePoint.setHours(now.getHours() - (i * 8.4));
                else if(rentang === '1bln') timePoint.setDate(now.getDate() - Math.floor(i * 1.5));
                else if(rentang === '3bln') timePoint.setDate(now.getDate() - (i * 4.5));
                else if(rentang === '6bln') timePoint.setDate(now.getDate() - (i * 9));
                else if(rentang === '1t') timePoint.setDate(now.getDate() - (i * 18));

                // Tentukan format label (Jam saja, atau beserta tanggal)
                let timeStr = "";
                if (['1j', '6j', '12j', '1h'].includes(rentang)) {
                    timeStr = timePoint.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}); // cth: 14:00
                } else if (['3h', '1m', '1bln'].includes(rentang)) {
                    timeStr = timePoint.toLocaleDateString('id-ID', {day: 'numeric', month: 'short'}) + ", " + timePoint.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}); // cth: 12 Agu, 14:00
                } else {
                    timeStr = timePoint.toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: '2-digit'}); // cth: 12 Agu 26
                }
                
                labels.push(timeStr);

                // Buat data berjalan mulus dan masuk akal
                currentPh = Math.max(4, Math.min(9, currentPh + (Math.random() - 0.5) * 0.3));
                currentMoist = Math.max(40, Math.min(90, currentMoist + (Math.random() - 0.5) * 5));
                currentTemp = Math.max(18, Math.min(35, currentTemp + (Math.random() - 0.5) * 2));

                dataPh.push(currentPh);
                dataMoist.push(currentMoist);
                dataTemp.push(currentTemp);
            }

            sebotaniChart.data.labels = labels;
            sebotaniChart.data.datasets[0].data = dataPh;
            sebotaniChart.data.datasets[1].data = dataMoist;
            sebotaniChart.data.datasets[2].data = dataTemp;
            sebotaniChart.update();
        }

        ubahWaktu('1j');
        document.querySelectorAll('.waktu-btn')[0].classList.add('bg-primary', 'text-white');
        document.querySelectorAll('.waktu-btn')[0].classList.remove('bg-surface-variant', 'text-on-surface-variant');
    </script>

    <!-- AI LOGIC & WEBSOCKET REALTIME -->
    <script>
        function prosesAnalisisAI(ph, moisture, temp) {
            let masalah = [];
            let saran = [];

            if (ph < 6.0) { masalah.push("pH terlalu asam (" + ph + ")"); saran.push("Taburkan kapur dolomit pertanian untuk menetralkan keasaman tanah."); }
            else if (ph > 7.5) { masalah.push("pH terlalu basa (" + ph + ")"); saran.push("Tambahkan bahan organik atau sulfur pertanian untuk menurunkan pH."); }

            if (moisture < 50) { masalah.push("tanah sangat kering (" + moisture + "%)"); saran.push("Segera lakukan penyiraman intensif. Pertimbangkan penggunaan mulsa organik untuk menahan air."); }
            else if (moisture > 85) { masalah.push("tanah terlalu basah/tergenang (" + moisture + "%)"); saran.push("Kurangi penyiraman dan segera perbaiki saluran drainase kebun agar akar kopi tidak membusuk."); }

            if (temp < 18) { masalah.push("suhu udara terlalu dingin (" + temp + "°C)"); saran.push("Kurangi kanopi pohon peneduh sementara agar sinar matahari pagi bisa masuk memanaskan kebun."); }
            else if (temp > 32) { masalah.push("suhu udara terlalu panas (" + temp + "°C)"); saran.push("Tingkatkan frekuensi pengkabutan/penyiraman ringan, dan pastikan pohon penaung tumbuh dengan baik."); }

            const aiTextElement = document.getElementById('ai-text');

            if (masalah.length === 0) {
                aiTextElement.innerHTML = "🌱 <strong>Kondisi Ideal!</strong> Saat ini pH, kelembapan, dan suhu kebun Anda berada pada rentang yang sangat optimal untuk pertumbuhan. Pertahankan rutinitas perawatan dan pemupukan Anda.";
            } else {
                let kalimatMasalah = masalah.join(", ");
                let kalimatSaran = saran.map(s => "<li>" + s + "</li>").join("");
                
                aiTextElement.innerHTML = `⚠️ <strong>Perhatian:</strong> Sistem mendeteksi bahwa <strong>${kalimatMasalah}</strong>.<br><br>
                <strong>Tindakan yang direkomendasikan:</strong>
                <ul class="list-disc pl-5 mt-1 space-y-1">${kalimatSaran}</ul>`;
            }
        }

        let mesinTimeout;
        const BATAS_WAKTU_TUNGGU = 15000;

        function aturUlangWaktuTunggu() {
            clearTimeout(mesinTimeout); 
            mesinTimeout = setTimeout(() => {
                console.warn("Mesin tidak merespons selama 15 detik.");
                tampilkanPopup();
            }, BATAS_WAKTU_TUNGGU);
        }

        const wsUrl = 'wss://console.flux.id/ws/public/nodes/c3d4e33c-b9df-45e4-af6d-71a4a183541f';
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            console.log("Koneksi berhasil!");
            aturUlangWaktuTunggu();
        }

        socket.onclose = () => { clearTimeout(mesinTimeout); tampilkanPopup(); };
        socket.onerror = (error) => { clearTimeout(mesinTimeout); tampilkanPopup(); };

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === 'telemetry' && data.payload && data.payload.payload) {
                    aturUlangWaktuTunggu(); 

                    const p = data.payload.payload;
                    const cPh = p.soil_ph !== undefined ? parseFloat(p.soil_ph) : NaN;
                    const cMoist = p.soil_moisture !== undefined ? parseFloat(p.soil_moisture) : NaN;
                    const cTemp = p.soil_temprature !== undefined ? parseFloat(p.soil_temprature) : NaN;

                    if(!isNaN(cPh)) document.getElementById('live-ph').innerText = cPh.toFixed(1);
                    if(!isNaN(cMoist)) document.getElementById('live-moist').innerText = Math.round(cMoist) + '%';
                    if(!isNaN(cTemp)) document.getElementById('live-temp').innerText = cTemp.toFixed(1) + '°C';

                    if(!isNaN(cPh) && !isNaN(cMoist) && !isNaN(cTemp)) {
                        prosesAnalisisAI(cPh, cMoist, cTemp);
                        
                        // Menambahkan waktu asli saat ini (bukan titik) ke grafik live
                        const now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                        sebotaniChart.data.labels.push(now);
                        sebotaniChart.data.datasets[0].data.push(cPh);
                        sebotaniChart.data.datasets[1].data.push(cMoist);
                        sebotaniChart.data.datasets[2].data.push(cTemp);

                        if (sebotaniChart.data.labels.length > 20) {
                            sebotaniChart.data.labels.shift();
                            sebotaniChart.data.datasets[0].data.shift();
                            sebotaniChart.data.datasets[1].data.shift();
                            sebotaniChart.data.datasets[2].data.shift();
                        }
                        sebotaniChart.update('none');
                    }
                }
            } catch (err) {
                console.log("Mengabaikan pesan non-JSON dari server.");
            }
        };
    </script>
</body>
</html>
